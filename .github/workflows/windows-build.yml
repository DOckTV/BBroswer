name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Search.Windows.csproj
      - name: Build
        run: dotnet build Search.Windows.csproj --configuration Release --no-restore
      - name: Publish portable Windows app
        run: dotnet publish Search.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -o publish
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BBroswer-Windows-x64
          path: publish/
          retention-days: 14
